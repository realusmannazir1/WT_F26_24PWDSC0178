<!DOCTYPE html>
<html>
<head>
  <title>CSS Basics</title>
  <style>
    body {
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background-color: #f0f0f0;
    }

    .rounded-image {
      width: 150px;
      height: 150px;
      overflow: hidden;
      border-radius: 100px;
      margin-left: 10px;
    }

    .rounded-image img {
      width: 100%;
      height: auto;
    }
  </style>
</head>
<body>
  <h1>Welcome to CS 311 - Web Programming</h1>
  <div class="rounded-image">
    <img src="image.jpg" alt="Round Image">
  </div>
</body>
</html>
