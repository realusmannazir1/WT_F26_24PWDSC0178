<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Typography Showcase</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto&family=Poppins&family=Oswald&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Typography Showcase</h1>

    <p class="roboto">This text uses Roboto.</p>
    <p class="poppins">This text uses Poppins.</p>
    <p class="oswald">This text uses Oswald.</p>

    <h2 class="sizes">Different Font Sizes</h2>

    <p class="px">Pixel Size</p>
    <p class="em">EM Size</p>
    <p class="rem">REM Size</p>

    <p class="center">Centered Text</p>
    <p class="uppercase">text transformation example</p>
    <p class="underline">Text Decoration</p>
    <p class="shadow">Text Shadow Effect</p>

</body>
</html>
