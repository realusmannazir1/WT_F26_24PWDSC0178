    .workspace{margin-left:258px;min-height:100vh;transition:margin-left .25s ease}.topbar{height:70px;position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 25px;gap:15px}.menu-button{display:grid;font-size:20px;line-height:1}.current{min-width:0;flex:1}.current small{display:block;color:var(--muted);font-size:10px;margin-bottom:3px}.current strong{font-size:14px}.top-actions{display:flex;align-items:center;gap:9px}.top-button{height:36px;min-width:36px;border:1px solid var(--line);background:var(--surface2);border-radius:10px;display:grid;place-items:center;cursor:pointer}.top-button:hover{border-color:var(--accent)}.top-button:focus-visible,.nav-link:focus-visible{outline:3px solid var(--pink);outline-offset:2px}.user-chip{display:flex;align-items:center;gap:9px;padding-left:7px}.user-avatar{width:33px;height:33px;border-radius:11px;display:grid;place-items:center;color:white;font-size:11px;font-weight:800;background:linear-gradient(135deg,#6c63ff,#ff6584)}.user-name{font-size:11px;font-weight:700}.user-role{font-size:9px;color:var(--muted);margin-top:2px}
    .content{padding:18px 20px 24px;height:calc(100vh - 70px);min-height:440px}.frame-wrap{height:100%;overflow:hidden;border:1px solid var(--line);border-radius:14px;background:var(--surface);box-shadow:var(--shadow)}.task-frame{width:100%;height:100%;border:0;display:block;background:var(--bg)}.task-frame[hidden]{display:none}.overlay{display:none}
    .skip-link{position:fixed;left:12px;top:10px;z-index:60;padding:10px 14px;border-radius:9px;background:var(--surface);color:var(--ink);box-shadow:var(--shadow);transform:translateY(-160%)}.skip-link:focus{transform:translateY(0)}
    @media(min-width:901px){.sidebar.closed{transform:translateX(-100%)}body.sidebar-collapsed .workspace{margin-left:0}}
    @media(max-width:900px){.sidebar{transform:translateX(-100%)}.sidebar.open{transform:translateX(0)}.workspace{margin-left:0}.overlay.open{display:block;position:fixed;inset:0;background:#08091499;z-index:25}.content{padding:14px;height:calc(100vh - 64px)}.topbar{height:64px;padding:0 14px}}
    @media(max-width:520px){.topbar{gap:9px}.user-copy{display:none}.content{padding:9px;height:calc(100vh - 58px);min-height:390px}.topbar{height:58px}.current strong{font-size:12px}.top-button{height:34px;min-width:34px}.frame-wrap{border-radius:10px}}
  </style>

  <main class="workspace">
    <header class="topbar">
      <button class="top-button menu-button" id="menuButton" type="button" aria-label="Open task navigation" aria-controls="sidebar" aria-expanded="true" title="Toggle task navigation">⋮</button>
      <div class="current"><small>LAB 05 &amp; 06 <span aria-hidden="true">/</span> WEB TECHNOLOGIES</small><strong id="pageTitle">Store Dashboard</strong></div>
      <div class="top-actions"><button class="top-button" id="themeButton" aria-label="Switch color theme" title="Switch color theme">🌙</button><div class="user-chip"><div class="user-avatar">UN</div><div class="user-copy"><div class="user-name">Usman Nazir</div><div class="user-role">BS Data Science · Semester 5</div></div></div></div>

  <script>
    (() => {
      const sidebar = document.getElementById('sidebar');
      const overlay = document.getElementById('overlay');
      const frameHost = document.getElementById('frameHost');
      const pageTitle = document.getElementById('pageTitle');
      const navButtons = [...document.querySelectorAll('.nav-link')];
      const frames = new Map();
      const root = document.documentElement;
      const themeButton = document.getElementById('themeButton');
      const productKey = 'shopzone-products';
      let theme = 'light';

      try { theme = localStorage.getItem('main-theme') || 'light'; } catch {}
      root.dataset.theme = theme;
      const paintThemeButton = () => { themeButton.textContent = theme === 'dark' ? '☀️' : '🌙'; };
      const setTheme = (value) => {
        theme = value;
        root.dataset.theme = theme;
        try { localStorage.setItem('main-theme', theme); } catch {}
        frames.forEach(frame => frame.contentWindow.postMessage({channel:'shopzone:theme',theme}, '*'));
        paintThemeButton();
      };
      const menuButton = document.getElementById('menuButton');
      const mobileLayout = () => matchMedia('(max-width: 900px)').matches;
      const setMenuOpen = open => {
        const mobile = mobileLayout();
        if (mobile) {
          sidebar.classList.toggle('open', open);
          overlay.classList.toggle('open', open);
        } else {
          sidebar.classList.toggle('closed', !open);
          document.body.classList.toggle('sidebar-collapsed', !open);
          overlay.classList.remove('open');
        }
        menuButton.setAttribute('aria-expanded', String(open));
        menuButton.setAttribute('aria-label', `${open ? 'Close' : 'Open'} task navigation`);
      };
      const closeMenu = () => { if (mobileLayout()) setMenuOpen(false); };
      setMenuOpen(!mobileLayout());

      function selectPage(button, updateHash = true) {
        if (!button) return;
        const id = button.dataset.id;
        navButtons.forEach(item => {
          const active = item === button;
          item.classList.toggle('active', active);
          if (active) item.setAttribute('aria-current', 'page');
          else item.removeAttribute('aria-current');
        });
        pageTitle.textContent = button.dataset.title;
        let frame = frames.get(id);
        if (!frame) {
          frame = document.createElement('iframe');
          frame.className = 'task-frame';
          frame.title = button.dataset.title;
          frame.src = button.dataset.file;
          frame.loading = 'lazy';
          frameHost.appendChild(frame);
          frames.set(id, frame);
          frame.addEventListener('load', () => {
            frame.contentWindow.postMessage({channel:'shopzone:theme',theme}, '*');
            try {
              frame.contentDocument.addEventListener('click', event => {
                const link = event.target.closest('a[href]');
                if (!link) return;
                const url = new URL(link.href, frame.src);
                if (url.origin !== location.origin) return;
                const file = url.pathname.split('/').pop().toLowerCase();
                const currentFile = new URL(frame.src, location.href).pathname.split('/').pop().toLowerCase();
                if (file === currentFile && !file.endsWith('main.html')) return;
                let destination = url.hash.slice(1);
                if (file === 'main.html' && !destination) destination = 'task09';
                const target = navButtons.find(item => item.dataset.id === destination || item.dataset.file.split('?')[0].toLowerCase() === file);
                if (target) { event.preventDefault(); selectPage(target); }
              }, true);
            } catch { /* Local file origins may block iframe document access; normal links still work. */ }
          });
        }
        frames.forEach((page, key) => { page.hidden = key !== id; });
        if (updateHash && location.hash !== `#${id}`) history.replaceState(null, '', `#${id}`);
        closeMenu();
      }

      navButtons.forEach(button => button.addEventListener('click', () => selectPage(button)));
      const initial = navButtons.find(button => button.dataset.id === location.hash.slice(1)) || navButtons.find(button => button.dataset.id === 'task09');
      selectPage(initial, false);
      themeButton.addEventListener('click', () => setTheme(theme === 'dark' ? 'light' : 'dark'));
      document.getElementById('taskSearch').addEventListener('input', event => {
        const query = event.target.value.trim().toLowerCase();
        navButtons.forEach(button => { button.hidden = !button.textContent.toLowerCase().includes(query); });
      });
      menuButton.addEventListener('click', () => {
        const isOpen = mobileLayout() ? sidebar.classList.contains('open') : !sidebar.classList.contains('closed');
        setMenuOpen(!isOpen);
      });
      overlay.addEventListener('click', closeMenu);
      document.addEventListener('keydown', event => { if (event.key === 'Escape') setMenuOpen(false); });
      window.addEventListener('resize', () => {
        if (mobileLayout()) { sidebar.classList.remove('closed'); document.body.classList.remove('sidebar-collapsed'); }
        else { sidebar.classList.remove('open'); overlay.classList.remove('open'); }
        const open = mobileLayout() ? sidebar.classList.contains('open') : !sidebar.classList.contains('closed');
        menuButton.setAttribute('aria-expanded', String(open));
        menuButton.setAttribute('aria-label', `${open ? 'Close' : 'Open'} task navigation`);
      });

      const readProducts = () => {
        try { const products = JSON.parse(localStorage.getItem(productKey) || '[]'); return Array.isArray(products) ? products.filter(product => product && typeof product.id === 'string' && typeof product.name === 'string' && typeof product.category === 'string' && Number.isFinite(Number(product.price)) && Number(product.price) > 0) : []; }
        catch { return []; }
      };
      window.addEventListener('message', event => {
        if (![...frames.values()].some(frame => frame.contentWindow === event.source)) return;
        const message = event.data;
        if (!message || message.channel !== 'shopzone:api' || typeof message.requestId !== 'string') return;
        const reply = (ok, value) => event.source.postMessage({channel:'shopzone:api:response',requestId:message.requestId,ok,value}, '*');
        try {
          if (message.action === 'products:list') { reply(true, readProducts()); return; }
          if (message.action === 'products:create') {
            const item = message.payload;
            if (!item || typeof item.name !== 'string' || !item.name.trim() || item.name.length > 70 || typeof item.category !== 'string' || item.category.length > 40 || !Number.isFinite(Number(item.price)) || Number(item.price) <= 0) { reply(false, null); return; }
            const products = readProducts();
            const product = {id:`p-${Date.now()}-${Math.random().toString(16).slice(2,7)}`,name:item.name.trim(),category:item.category,price:Number(item.price),createdAt:new Date().toISOString()};
            products.unshift(product);
            localStorage.setItem(productKey, JSON.stringify(products));
            reply(true, product);
            return;
          }
          reply(false, null);
        } catch { reply(false, null); }
      });
      paintThemeButton();
    })();
  </script>
