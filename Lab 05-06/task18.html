<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dark Mode Media Query</title>

<style>
:root {
    --background: #ffffff;
    --text: #222222;
    --card: #eeeeee;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: var(--background);
    color: var(--text);
}

.container {
    max-width: 900px;
    margin: auto;
    padding: 40px 20px;
}

.card {
    padding: 30px;
    margin-top: 20px;
    background: var(--card);
    border-radius: 10px;
}

/* User's system prefers dark mode */
@media (prefers-color-scheme: dark) {

    :root {
        --background: #121212;
        --text: #f5f5f5;
        --card: #222222;
    }
}

/* Reduced motion preference */
@media (prefers-reduced-motion: reduce) {

    * {
        scroll-behavior: auto;
        transition: none !important;
        animation: none !important;
    }
}

/* Portrait orientation */
@media (orientation: portrait) {

    .container {
        padding-top: 25px;
    }
}

/* Landscape orientation */
@media (orientation: landscape) {

    .container {
        max-width: 1100px;
    }
}
</style>
</head>

<body>

<div class="container">

<h1>Media Preference Demonstration</h1>

<div class="card">

<h2>Dark Mode</h2>

<p>
If your operating system is configured for dark mode,
this page automatically changes its appearance.
</p>

</div>

<div class="card">

<h2>Responsive Preferences</h2>

<p>
This page also demonstrates reduced-motion and
orientation media queries.
</p>

</div>

</div>

</body>
</html>
