<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Responsive Data Table</title>

<style>
body {
    margin: 0;
    padding: 30px;
    font-family: Arial, sans-serif;
}

.table-container {
    max-width: 1000px;
    margin: auto;
    overflow-x: auto;
}

table {
    width: 100%;
    border-collapse: collapse;
    min-width: 650px;
}

th,
td {
    padding: 14px;
    border: 1px solid #aaa;
    text-align: left;
}

th {
    background: #222;
    color: white;
}

tr:nth-child(even) {
    background: #eee;
}

@media (max-width: 600px) {
    body {
        padding: 15px;
    }
}
</style>
</head>

<body>

<h1>Student Records</h1>

<div class="table-container">

<table>

<thead>
<tr>
<th>ID</th>
<th>Name</th>
<th>Department</th>
<th>Semester</th>
<th>CGPA</th>
</tr>
</thead>

<tbody>

<tr>
<td>001</td>
<td>Ali</td>
<td>Computer Science</td>
<td>4</td>
<td>3.20</td>
</tr>

<tr>
<td>002</td>
<td>Ahmed</td>
<td>Data Science</td>
<td>5</td>
<td>3.45</td>
</tr>

<tr>
<td>003</td>
<td>Usman</td>
<td>Software Engineering</td>
<td>3</td>
<td>3.10</td>
</tr>

</tbody>

</table>

</div>

</body>
</html>
