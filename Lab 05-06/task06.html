<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Task 6 – CSS Grid Gallery</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: #1a1a2e;
    color: white;
    padding: 40px 20px;
  }

  .page-header {
    text-align: center;
    margin-bottom: 40px;
  }
  .page-header h1 { font-size: 2.2rem; margin-bottom: 8px; }
  .page-header h1 span { color: #e94560; }
  .page-header p { color: rgba(255,255,255,0.5); }

  .gallery {
    max-width: 1100px;
    margin: auto;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
  }

  .gallery-item {
    position: relative;
    overflow: hidden;
    border-radius: 10px;
    cursor: pointer;
  }

  .gallery-item img {
    width: 100%;
    height: 220px;
    object-fit: cover;
    display: block;
    transition: transform 0.4s;
  }
  .gallery-item:hover img { transform: scale(1.08); }

  .gallery-item .overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(to top, rgba(233,69,96,0.85) 0%, transparent 60%);
    opacity: 0;
    transition: opacity 0.3s;
    display: flex;
    align-items: flex-end;
    padding: 15px;
  }
  .gallery-item:hover .overlay { opacity: 1; }
  .overlay span { color: white; font-weight: bold; font-size: 0.9rem; }

  /* Featured first image */
  .gallery-item:first-child {
    grid-column: span 2;
    grid-row: span 2;
  }
  .gallery-item:first-child img { height: 100%; min-height: 452px; }

  @media (max-width: 800px) {
    .gallery { grid-template-columns: repeat(2, 1fr); }
    .gallery-item:first-child { grid-column: span 2; }
    .gallery-item:first-child img { min-height: 300px; }
  }

  @media (max-width: 500px) {
    .gallery { grid-template-columns: 1fr; }
    .gallery-item:first-child { grid-column: span 1; }
    .gallery-item:first-child img { min-height: 220px; }
    .gallery-item img { height: 200px; }
  }
</style>
</head>
<body>

<div class="page-header">
  <h1>Photo <span>Gallery</span></h1>
  <p>CSS Grid Layout — hover over images to see the effect</p>
</div>

<div class="gallery">

  <div class="gallery-item">
    <img src="https://picsum.photos/700/700?random=10" alt="Featured">
    <div class="overlay"><span>🌟 Featured Photo</span></div>
  </div>

  <div class="gallery-item">
    <img src="https://picsum.photos/400/400?random=11" alt="Photo 2">
    <div class="overlay"><span>📸 Nature</span></div>
  </div>

  <div class="gallery-item">
    <img src="https://picsum.photos/400/400?random=12" alt="Photo 3">
    <div class="overlay"><span>📸 Architecture</span></div>
  </div>

  <div class="gallery-item">
    <img src="https://picsum.photos/400/400?random=13" alt="Photo 4">
    <div class="overlay"><span>📸 Travel</span></div>
  </div>

  <div class="gallery-item">
    <img src="https://picsum.photos/400/400?random=14" alt="Photo 5">
    <div class="overlay"><span>📸 Technology</span></div>
  </div>

  <div class="gallery-item">
    <img src="https://picsum.photos/400/400?random=15" alt="Photo 6">
    <div class="overlay"><span>📸 Abstract</span></div>
  </div>

  <div class="gallery-item">
    <img src="https://picsum.photos/400/400?random=16" alt="Photo 7">
    <div class="overlay"><span>📸 Landscape</span></div>
  </div>

</div>

</body>
</html>
