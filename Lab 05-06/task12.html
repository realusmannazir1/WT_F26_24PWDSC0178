<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Task 12 – Registration Form</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: linear-gradient(135deg, #1a1a2e 0%, #0f3460 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
  }

  .form-wrapper {
    width: 100%;
    max-width: 820px;
    background: white;
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 25px 60px rgba(0,0,0,0.4);
    display: flex;
  }

  /* LEFT PANEL */
  .form-side {
    width: 260px;
    flex-shrink: 0;
    background: linear-gradient(180deg, #1a1a2e 0%, #e94560 100%);
    padding: 40px 30px;
    color: white;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  .form-side h2 { font-size: 1.4rem; margin-bottom: 10px; }
  .form-side p { font-size: 0.85rem; color: rgba(255,255,255,0.7); line-height: 1.6; }
  .form-side .steps { margin-top: 30px; }
  .step {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 0;
    border-bottom: 1px solid rgba(255,255,255,0.1);
  }
  .step:last-child { border-bottom: none; }
  .step-num {
    width: 28px; height: 28px;
    border-radius: 50%;
    background: rgba(255,255,255,0.15);
    display: flex; align-items: center; justify-content: center;
    font-size: 0.8rem; font-weight: bold; flex-shrink: 0;
  }
  .step.done .step-num { background: #4caf50; }
  .step.active .step-num { background: white; color: #e94560; }
  .step span { font-size: 0.85rem; color: rgba(255,255,255,0.75); }
  .step.active span { color: white; font-weight: bold; }
  .form-side-footer { font-size: 0.75rem; color: rgba(255,255,255,0.4); }

  /* RIGHT PANEL */
  .form-main { flex: 1; padding: 40px 35px; }
  .form-main h1 { font-size: 1.5rem; color: #1a1a2e; margin-bottom: 5px; }
  .form-main .sub { color: #999; font-size: 0.85rem; margin-bottom: 30px; }

  .form-row {
    display: flex;
    gap: 18px;
    margin-bottom: 18px;
  }

  .form-group {
    flex: 1;
    display: flex;
    flex-direction: column;
  }

  label {
    font-size: 0.8rem;
    font-weight: 600;
    color: #555;
    margin-bottom: 6px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  input, select, textarea {
    padding: 12px 14px;
    border: 1.5px solid #e0e0e0;
    border-radius: 8px;
    font-size: 0.9rem;
    color: #333;
    background: #fafafa;
    transition: border-color 0.2s, box-shadow 0.2s;
    font-family: inherit;
  }
  input:focus, select:focus, textarea:focus {
    outline: none;
    border-color: #e94560;
    box-shadow: 0 0 0 3px rgba(233,69,96,0.1);
    background: white;
  }

  textarea { min-height: 110px; resize: vertical; }

  .divider {
    border: none;
    border-top: 1px solid #f0f0f0;
    margin: 20px 0;
  }

  .form-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
    margin-top: 10px;
  }
  .form-footer p { font-size: 0.8rem; color: #aaa; }
  .form-footer p a { color: #e94560; text-decoration: none; }

  .btn-submit {
    background: linear-gradient(135deg, #e94560, #c62a47);
    color: white;
    border: none;
    padding: 13px 35px;
    border-radius: 8px;
    font-size: 0.95rem;
    font-weight: bold;
    cursor: pointer;
    letter-spacing: 0.5px;
    transition: opacity 0.2s, transform 0.2s;
  }
  .btn-submit:hover { opacity: 0.9; transform: translateY(-1px); }

  @media (max-width: 700px) {
    .form-wrapper { flex-direction: column; }
    .form-side { width: 100%; padding: 25px; }
    .form-side .steps { display: none; }
    .form-main { padding: 25px 20px; }
    .form-row { flex-direction: column; gap: 0; }
    .form-group { margin-bottom: 15px; }
  }
</style>
</head>
<body>

<div class="form-wrapper">

  <div class="form-side">
    <div>
      <h2>Registration</h2>
      <p>Fill in your details to create your account at UET Peshawar portal.</p>
      <div class="steps">
        <div class="step done"><div class="step-num">✓</div><span>Account Type</span></div>
        <div class="step active"><div class="step-num">2</div><span>Personal Info</span></div>
        <div class="step"><div class="step-num">3</div><span>Academic Info</span></div>
        <div class="step"><div class="step-num">4</div><span>Confirmation</span></div>
      </div>
    </div>
    <div class="form-side-footer">UET Peshawar © 2026</div>
  </div>

  <div class="form-main">
    <h1>Personal Information</h1>
    <p class="sub">Step 2 of 4 — Please fill all required fields</p>

    <form>
      <div class="form-row">
        <div class="form-group">
          <label>First Name</label>
          <input type="text" placeholder="Muhammad">
        </div>
        <div class="form-group">
          <label>Last Name</label>
          <input type="text" placeholder="Usman">
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Email Address</label>
          <input type="email" placeholder="student@uetpeshawar.edu.pk">
        </div>
        <div class="form-group">
          <label>Phone Number</label>
          <input type="tel" placeholder="+92 300 0000000">
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Department</label>
          <select>
            <option>Computer Science</option>
            <option>Data Science</option>
            <option>Software Engineering</option>
            <option>Electrical Engineering</option>
          </select>
        </div>
        <div class="form-group">
          <label>Semester</label>
          <select>
            <option>1st Semester</option>
            <option>2nd Semester</option>
            <option>3rd Semester</option>
            <option selected>5th Semester</option>
          </select>
        </div>
      </div>

      <hr class="divider">

      <div class="form-row">
        <div class="form-group">
          <label>Message / Notes</label>
          <textarea placeholder="Any additional information..."></textarea>
        </div>
      </div>

      <div class="form-footer">
        <p>Already registered? <a href="#">Sign in here</a></p>
        <button type="submit" class="btn-submit">Continue →</button>
      </div>
    </form>
  </div>

</div>

</body>
</html>
